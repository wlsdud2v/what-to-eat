<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘 뭐 먹지?</title>
  <link rel="icon" type="image/svg+xml" href="icon/icon.svg" />
  <link rel="icon" type="image/png" sizes="128x128" href="icon/icon_128.png" />
  <link rel="apple-touch-icon" href="icon/icon_512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>오늘 뭐 먹지? <span class="bowl">🍚</span></h1>
    <p class="sub">지금 있는 곳의 날씨와 계절에 맞춰 메뉴를 고르고, 근처 식당을 찾아드려요.</p>
  </header>

  <main>
    <!-- 현재 상황 -->
    <section class="card context">
      <div class="ctx-row">
        <div class="ctx-item" id="ctx-place"><span class="ico">📍</span><div><small>위치</small><b>확인 중…</b></div></div>
        <div class="ctx-item" id="ctx-weather"><span class="ico">⏳</span><div><small>날씨</small><b>불러오는 중…</b></div></div>
        <div class="ctx-item" id="ctx-season"><span class="ico">🗓️</span><div><small>계절</small><b>-</b></div></div>
      </div>

      <form id="search-form" class="search">
        <input id="search-input" type="search" placeholder="동네·주소·역 이름으로 위치 바꾸기 (예: 강남역, 해운대)" />
        <button type="submit">검색</button>
        <button type="button" id="btn-locate" title="현재 위치">🎯</button>
      </form>

      <div class="options">
        <div class="seg" id="meal-seg">
          <button data-meal="lunch">☀️ 점심</button>
          <button data-meal="dinner">🌙 저녁</button>
        </div>
        <select id="weather-override" title="날씨 직접 고르기">
          <option value="">날씨: 자동</option>
          <option value="clear">맑음</option>
          <option value="rain">비</option>
          <option value="snow">눈</option>
          <option value="hot">무더위</option>
          <option value="cold">한파</option>
        </select>
        <select id="radius" title="검색 반경">
          <option value="500">반경 500m</option>
          <option value="1000" selected>반경 1km</option>
          <option value="2000">반경 2km</option>
        </select>
      </div>
      <div class="chips" id="cat-chips"></div>
    </section>

    <!-- 추천 메뉴 -->
    <section>
      <div class="sec-head">
        <h2>추천 메뉴</h2>
        <button id="btn-reroll" class="ghost">🎲 다시 추천</button>
      </div>
      <div id="recs" class="recs"><div class="placeholder">위치와 날씨를 확인하고 있어요…</div></div>
    </section>

    <!-- 주변 식당 -->
    <section class="card places">
      <div class="sec-head">
        <h2 id="places-title">주변 식당</h2>
        <div class="ext" id="ext-links"></div>
      </div>
      <div class="places-body">
        <div id="map"></div>
        <ul id="place-list" class="place-list"></ul>
      </div>
      <p class="note" id="source-note">식당 정보는 OpenStreetMap 기준이라 누락된 곳이 있을 수 있어요. 더 많은 결과는 카카오맵·네이버지도 버튼으로 확인하세요.</p>
    </section>
  </main>

  <footer id="footer">날씨 © Open-Meteo · 지도·식당 © OpenStreetMap contributors</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="recommend.js"></script>
  <script src="kakao.js"></script>
  <script src="app.js"></script>
</body>
</html>
